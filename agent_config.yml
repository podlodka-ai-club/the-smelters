# Agent Configuration (applies to coder, reviewer, and android_coder)

# Implementation choice: "gemini" (uses opencode CLI) or "claude" (uses claude_agent_sdk)
implementation: gemini

# Google Gemini API key - leave empty if using GEMINI_API_KEY env var or opencode auth
gemini_api_key: ""

# Anthropic API key - optional if you have Claude Code CLI subscription
anthropic_api_key: ""

# Model to use with opencode CLI (provider/model)
# Default model for legacy agents/android_coder and shared/agent_base subprocess runs.
gemini_model: google/gemini-3.1-pro-preview-customtools

# Smelters workflow (agno_orchestrator.py): backends when CLI omits --coder/--checker/--reviewer.
# Override per run with those flags. Values: coder [claude|gemini|claude-cli|opencode],
# checker [gemini|claude-cli|opencode], reviewer [claude|opencode].
smelters_coder_backend: opencode
smelters_checker_backend: opencode
smelters_reviewer_backend: opencode

# Per-role opencode models (`opencode run --model <id>`) when backend is opencode.
opencode_coder_model: opencode/minimax-m2.5-free
opencode_checker_model: opencode/ling-2.6-flash-free
opencode_reviewer_model: opencode/nemotron-3-super-free
#
# Other FREE models available in your current opencode setup:
# - opencode/hy3-preview-free
# - opencode/ling-2.6-flash-free
# - opencode/minimax-m2.5-free
# - opencode/nemotron-3-super-free
# - google/gemma-3-4b-it
# - google/gemma-3-12b-it
# - google/gemma-3-27b-it
# - google/gemma-3n-e2b-it
# - google/gemma-3n-e4b-it
# - google/gemma-4-26b-a4b-it
# - google/gemma-4-31b-it
#
# Recommended non-free options (best quality/value):
# - google/gemini-3.1-pro-preview-customtools  # Gemini 3.1 Pro + custom tools (default below)
# - google/gemini-3.1-pro-preview   # strongest overall quality (no custom-tools variant)
# - google/gemini-2.5-pro           # strong stable quality
# - google/gemini-2.5-flash         # best value/speed paid default

# Optional: attach to a running opencode server (start with `opencode serve`)
# Leave empty to run opencode in standalone mode
opencode_server_url: ""

# Anthropic API key - leave empty if using ANTHROPIC_API_KEY env var or Claude Code subscription
anthropic_api_key: ""

# Timeout in seconds for the agent to complete a task (default: 2 hours = 7200 seconds)
agent_timeout: 7200

# Timeout in seconds for no stdout activity during agent run (default: 10 minutes)
agent_inactivity_timeout: 900